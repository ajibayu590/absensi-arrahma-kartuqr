name: Build & Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Next.js
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: npm run build

      - name: Prepare Standalone Assets
        run: |
          cp -r public .next/standalone/public
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          cp server.js .next/standalone/server.js
          cp prisma/schema.prisma .next/standalone/prisma/schema.prisma
          mkdir -p .next/standalone/prisma
          cp prisma/schema.prisma .next/standalone/prisma/schema.prisma

      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /absensi.smkami.sch.id/
          local-dir: .next/standalone/
