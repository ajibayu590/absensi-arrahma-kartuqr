<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Koneksi Terputus - Absensi SMK Ar-Rahma</title>
  <style>
    :root {
      --primary: #059669;
      --primary-hover: #047857;
      --bg: #f9fafb;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-muted: #6b7280;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #09090b;
        --card-bg: #18181b;
        --text-main: #f4f4f5;
        --text-muted: #a1a1aa;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 400px;
      width: 90%;
      padding: 2.5rem 2rem;
      background-color: var(--card-bg);
      border: 1px solid rgba(228, 228, 231, 0.5);
      border-radius: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
    }

    @media (prefers-color-scheme: dark) {
      .container {
        border-color: rgba(39, 39, 42, 0.5);
      }
    }

    .logo {
      width: 96px;
      height: auto;
      margin-bottom: 1.5rem;
    }

    .offline-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 1.5rem;
      color: var(--primary);
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 800;
      margin: 0 0 0.5rem 0;
    }

    p {
      font-size: 0.875rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin: 0 0 2rem 0;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 0.75rem 1.5rem;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 0.875rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/logo.webp" alt="Logo SMK Ar-Rahma" class="logo">
    <svg class="offline-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a4.978 4.978 0 01-1.414-3.536 4.978 4.978 0 011.414-3.536m0 0L5.636 5.636m4.243 4.243a2 2 0 011.962.172m0 0L8.464 13.464"></path>
    </svg>
    <h1>Koneksi Terputus</h1>
    <p>Aplikasi tidak dapat terhubung ke server. Harap periksa jaringan internet Anda dan coba lagi.</p>
    <button class="btn" onclick="window.location.reload(true)">Coba Lagi</button>
  </div>
</body>
</html>
